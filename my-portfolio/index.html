<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Apply the stored / system theme before first paint so there's no flash -->
  <script>
    try {
      var t = localStorage.getItem('agentfolio-theme');
      if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#212121');
      }
    } catch (e) {}
  </script>

  <!-- Above-the-fold face: start the font fetch with the HTML instead of
       waiting for the stylesheet to parse. -->
  <link rel="preload" href="/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin />

  <title>AgentFolio</title>
  <meta name="description"
    content="An agentic portfolio. Talk to an AI agent about Mirang Bhandari's projects, skills, and experience — Software Engineer & AI Researcher based in Mannheim, Germany." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Mirang Bhandari — AgentFolio" />
  <meta property="og:description"
    content="An agentic portfolio. Ask an AI agent anything about my projects, skills, and experience." />
  <meta property="og:image" content="/Agentfolio_Logo.png" />
  <meta property="og:site_name" content="AgentFolio" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mirang Bhandari — AgentFolio" />
  <meta name="twitter:description"
    content="An agentic portfolio. Ask an AI agent anything about my projects, skills, and experience." />
  <meta name="twitter:image" content="/Agentfolio_Logo.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
