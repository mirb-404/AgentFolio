<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- ?v= busts Chrome's favicon cache — bump it whenever the icon changes -->
  <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#212121" />

  <!-- Dark by default; switch to light before first paint only if the visitor chose it -->
  <script>
    var light = false;
    try { light = localStorage.getItem('agentfolio-theme') === 'light'; } catch (e) {}
    if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f7f5');
    else document.documentElement.classList.add('dark');
  </script>

  <!-- Above-the-fold face: start the font fetch with the HTML instead of
       waiting for the stylesheet to parse. -->
  <link rel="preload" href="/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin />

  <title>AgentFolio</title>
  <meta name="description"
    content="An agentic portfolio. Talk to an AI agent about Mirang Bhandari's projects, skills, and experience — Software Engineer & AI Researcher based in Mannheim, Germany." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Mirang Bhandari — AgentFolio" />
  <meta property="og:description"
    content="An agentic portfolio. Ask an AI agent anything about my projects, skills, and experience." />
  <meta property="og:image" content="/Agentfolio_Logo.png" />
  <meta property="og:site_name" content="AgentFolio" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mirang Bhandari — AgentFolio" />
  <meta name="twitter:description"
    content="An agentic portfolio. Ask an AI agent anything about my projects, skills, and experience." />
  <meta name="twitter:image" content="/Agentfolio_Logo.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
